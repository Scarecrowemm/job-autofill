<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>岗位投递助手 · 数据填写</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --pri: #0d3b66; --pri-l: #e8f0f8; --warn: #b9770e; --warn-bg: #fef5e7;
    --ok: #1e8449; --line: #dbe4ee; --txt: #1f2937; --muted: #6b7280;
  }
  body {
    margin: 0; background: #f4f7fa; color: var(--txt);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; font-size: 14px;
  }
  header {
    position: sticky; top: 0; z-index: 20; background: #fff;
    border-bottom: 2px solid var(--pri); padding: 12px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(13,59,102,.06);
  }
  header h1 { font-size: 17px; margin: 0; color: var(--pri); letter-spacing: 1px; }
  .grow { flex: 1; }
  .stat { font-size: 13px; color: var(--muted); }
  .stat b { color: var(--pri); font-size: 15px; }
  .bar { width: 160px; height: 8px; background: #e5eaf0; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg,#1e8449,#27ae60); width: 0; transition: width .25s; }
  button {
    font-family: inherit; font-size: 13px; padding: 7px 14px; border-radius: 6px;
    border: 1px solid var(--pri); background: #fff; color: var(--pri);
    cursor: pointer; transition: .15s;
  }
  button:hover { background: var(--pri-l); }
  button.primary { background: var(--pri); color: #fff; }
  button.primary:hover { background: #0a2f52; }
  button.mini { padding: 2px 8px; font-size: 11px; border-radius: 4px; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px; }
  .card {
    background: #fff; border-radius: 10px; margin-bottom: 16px;
    border: 1px solid var(--line); overflow: hidden;
  }
  .card > h2 {
    margin: 0; padding: 11px 16px; font-size: 14px; color: var(--pri);
    background: #f8fbfe; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .card > h2 .cnt { font-weight: 400; font-size: 12px; color: var(--muted); }
  .fields { padding: 14px 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 18px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld.full { grid-column: 1 / -1; }
  .fld > label { font-size: 12.5px; color: #374151; display: flex; align-items: center; gap: 6px; }
  .fld .tag {
    font-size: 10px; padding: 1px 6px; border-radius: 3px;
    background: var(--warn-bg); color: var(--warn); border: 1px solid #f5d9a8;
  }
  .fld .tag.filled { background: #eafaf1; color: var(--ok); border-color: #bfe8cf; }
  .fld .row { display: flex; gap: 6px; align-items: flex-start; }
  .fld .row > button.mini { flex: 0 0 auto; margin-top: 6px; }
  input[type=text], textarea {
    flex: 1; width: 100%; font-family: inherit; font-size: 13px; color: var(--txt);
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; outline: none; transition: .15s;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--pri); box-shadow: 0 0 0 3px rgba(13,59,102,.08); }
  textarea { resize: vertical; min-height: 68px; line-height: 1.6; }
  .fld.empty input, .fld.empty textarea { border-color: #f0c88a; background: #fffdf8; }
  .hint { font-size: 11px; color: var(--muted); }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #1f2937; color: #fff; padding: 9px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .tip {
    background: #fff8e6; border: 1px solid #f5d9a8; color: #7a5a10;
    padding: 10px 14px; border-radius: 8px; font-size: 12.5px; line-height: 1.7; margin-bottom: 16px;
  }
  .tip b { color: #8a5a00; }
  @media (max-width: 720px) {
    .fields { grid-template-columns: 1fr; }
    header { padding: 10px 14px; gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>岗位投递助手</h1>
  <div class="stat">待补充 <b id="todoCnt">0</b> 项</div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="stat" id="pct">0%</div>
  <div class="grow"></div>
  <button id="btnSave" class="primary">保存</button>
  <button id="btnExport">导出 JSON</button>
  <button id="btnImport">导入 JSON</button>
  <button id="btnCopyAll">复制全部</button>
</header>

<main>
  <div class="tip">
    <b>怎么用：</b>① 把下面橙色标出的「待补充」项填完 → ② 点右上角「保存」→ ③ 打开任意招聘网站，
    点右下角「自动填表」即可。<br>
    <b>说明：</b>数据保存在浏览器本地（chrome.storage），不上传任何服务器，扩展也不会自动提交表单。
    简历 PDF 需你自己在页面上手动上传（浏览器安全限制，任何扩展都无法代传）。
  </div>
  <div id="app"></div>
</main>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json" style="display:none">

<script>
/* ============ 默认数据（空模板，用户自行填写） ============ */
const DEFAULT_DATA = {
  basic: { name: "", gender: "", birth: "", age: "", political: "", nation: "", native_place: "", id_card: "", marriage: "", phone: "", email: "", wechat: "", qq: "", address: "", postcode: "", emergency_name: "", emergency_relation: "", emergency_phone: "" },
  education: { school: "", school_en: "", college: "", major: "", degree: "", edu_level: "", start: "", end: "", gpa: "", rank: "", cet4: "", cet6: "", other_cert: "", courses: "" },
  intent: { position: "", position_game: "", industry: "", city: "", salary: "", available_date: "", accept_relocate: "是", accept_overtime: "是", job_type: "全职" },
  work: [
    { company: "", department: "", title: "", start: "", end: "", city: "", description: "" },
  ],
  projects: [
    { name: "", role: "", start: "", end: "", tech: "", description: "" },
    { name: "", role: "", start: "", end: "", tech: "", description: "" },
    { name: "", role: "", start: "", end: "", tech: "", description: "" },
    { name: "", role: "", start: "", end: "", tech: "", description: "" },
  ],
  skills: { programming: "", data: "", engineering: "", ai: "", language: "" },
  campus: { role: "", description: "" },
  self_eval_short: "",
  self_eval_long: "",
  qa: { self_intro: "", why_company: "", career_plan: "", strength: "", weakness: "", hardest_thing: "", why_you: "", salary_expect: "", available: "" },
};

/* ============ 表单结构 ============ */
const SCHEMA = [
  { title: "基本信息", prefix: "basic", fields: [
    ["name","姓名"], ["gender","性别"], ["birth","出生年月","YYYY-MM"], ["age","年龄"],
    ["political","政治面貌"], ["nation","民族"], ["native_place","籍贯"], ["id_card","身份证号"],
    ["marriage","婚姻状况"], ["phone","手机号码"], ["email","电子邮箱"], ["wechat","微信号"],
    ["qq","QQ"], ["address","通讯地址",null,true], ["postcode","邮编"],
    ["emergency_name","紧急联系人"], ["emergency_relation","与本人关系"], ["emergency_phone","紧急联系人电话"]
  ]},
  { title: "教育背景", prefix: "education", fields: [
    ["school","毕业院校"], ["school_en","院校英文名"], ["college","学院"], ["major","专业"],
    ["degree","学位"], ["edu_level","学历"], ["start","入学时间","YYYY-MM"], ["end","毕业时间","YYYY-MM"],
    ["gpa","GPA / 绩点"], ["rank","专业排名"], ["cet4","英语四级"], ["cet6","英语六级"],
    ["other_cert","其他证书"], ["courses","主修课程",null,true]
  ]},
  { title: "求职意向", prefix: "intent", fields: [
    ["position","期望岗位（技术版）"], ["position_game","期望岗位（游戏版）"], ["industry","期望行业"],
    ["city","期望工作城市"], ["salary","期望薪资"], ["available_date","可到岗时间"],
    ["accept_relocate","是否服从调剂"], ["accept_overtime","是否接受加班"], ["job_type","求职类型"]
  ]},
  { title: "实习经历", prefix: "work.0", fields: [
    ["company","公司名称"], ["department","部门"], ["title","职位"], ["city","工作城市"],
    ["start","开始时间","YYYY-MM"], ["end","结束时间","YYYY-MM"], ["description","工作内容",null,true]
  ]},
  { title: "项目经历（1）", prefix: "projects.0", fields: [
    ["name","项目名称"], ["role","担任角色"], ["start","开始时间","YYYY-MM"], ["end","结束时间","YYYY-MM"],
    ["tech","技术栈"], ["description","项目描述",null,true]
  ]},
  { title: "项目经历（2）", prefix: "projects.1", fields: [
    ["name","项目名称"], ["role","担任角色"], ["start","开始时间","YYYY-MM"], ["end","结束时间","YYYY-MM"],
    ["tech","技术栈"], ["description","项目描述",null,true]
  ]},
  { title: "专业技能", prefix: "skills", fields: [
    ["programming","编程语言"], ["data","数据与建模"], ["engineering","协作与工程"],
    ["ai","AI 工具链"], ["language","外语能力"], ["",""]
  ]},
  { title: "校园经历", prefix: "campus", fields: [
    ["role","担任职务"], ["description","经历描述",null,true]
  ]},
  { title: "自我评价", prefix: "", fields: [
    ["self_eval_short","自我评价（短版 300 字）",null,true],
    ["self_eval_long","自我评价（长版 600 字）",null,true]
  ]},
  { title: "常见问答（面试/网申主观题）", prefix: "qa", fields: [
    ["self_intro","自我介绍",null,true],
    ["why_company","为什么选择我们公司",null,true],
    ["career_plan","职业规划",null,true],
    ["strength","你的优势",null,true],
    ["weakness","你的不足",null,true],
    ["hardest_thing","最有挑战的一件事",null,true],
    ["why_you","为什么录用你",null,true],
    ["salary_expect","期望薪资说明",null,true],
    ["available","可到岗说明",null,true]
  ]}
];

/* ============ 工具 ============ */
const STORE_KEY = "jaf_profile";   // 与 content.js 共用同一个存储键
const getPath = (o, p) => p.split(".").reduce((a,k)=> (a==null?undefined:a[k]), o);
const isReal = (v) => {
  const s = String(v == null ? "" : v).trim();
  return !!s && !/^\{\{.*\}\}$/.test(s); // {{PHONE_xxx}} 这类占位符视为未填
};
const setPath = (o, p, v) => {
  const ks = p.split(".");
  let cur = o;
  for (let i=0;i<ks.length-1;i++){ const k=ks[i]; if(cur[k]==null) cur[k] = /^\d+$/.test(ks[i+1])?[]:{}; cur=cur[k]; }
  cur[ks[ks.length-1]] = v;
};
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window.__tt);
  window.__tt = setTimeout(()=>t.classList.remove("show"), 1800);
}
function deepMerge(base, patch){
  const out = Array.isArray(base) ? [...base] : {...base};
  for (const k in patch){
    if (patch[k] && typeof patch[k] === "object" && !Array.isArray(patch[k]) && base[k] && typeof base[k] === "object"){
      out[k] = deepMerge(base[k], patch[k]);
    } else { out[k] = patch[k]; }
  }
  return out;
}

/* ============ 状态 ============ */
let DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));

/* 存储层：优先 chrome.storage.local（扩展环境），失败时回退 localStorage（便于本地调试） */
function persist() {
  try {
    if (typeof chrome !== "undefined" && chrome.storage && chrome.storage.local) {
      chrome.storage.local.set({ [STORE_KEY]: DATA });
      return true;
    }
  } catch (e) {}
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); return true; } catch (e) { return false; }
}

function loadThen(cb) {
  try {
    if (typeof chrome !== "undefined" && chrome.storage && chrome.storage.local) {
      chrome.storage.local.get([STORE_KEY], (res) => {
        if (res && res[STORE_KEY]) DATA = deepMerge(DATA, res[STORE_KEY]);
        cb();
      });
      return;
    }
  } catch (e) {}
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved) DATA = deepMerge(DATA, JSON.parse(saved));
  } catch (e) {}
  cb();
}

/* ============ 渲染 ============ */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  SCHEMA.forEach(sec=>{
    const card = document.createElement("section");
    card.className = "card";
    const filled = sec.fields.filter(([k])=>k && String(getPath(DATA, sec.prefix? sec.prefix+"."+k : k) || "").trim()).length;
    const total = sec.fields.filter(([k])=>k).length;
    card.innerHTML = `<h2>${sec.title}<span class="cnt">已填 ${filled}/${total}</span></h2>`;
    const box = document.createElement("div");
    box.className = "fields";

    sec.fields.forEach(([key, label, hint, full])=>{
      if (!key) return;
      const path = sec.prefix ? sec.prefix + "." + key : key;
      const val = String(getPath(DATA, path) || "");
      const ok = isReal(val);
      const isLong = !!full || val.length > 60;
      const fld = document.createElement("div");
      fld.className = "fld" + (full ? " full" : "") + (ok ? "" : " empty");
      fld.dataset.path = path;

      const lab = document.createElement("label");
      lab.innerHTML = `${label} <span class="tag ${ok?"filled":""}">${ok?"已填":"待补充"}</span>`
        + (hint ? ` <span class="hint">${hint}</span>` : "");

      const row = document.createElement("div");
      row.className = "row";
      const inp = document.createElement(isLong ? "textarea" : "input");
      if (isLong) { inp.rows = val.length > 200 ? 8 : 4; }
      else { inp.type = "text"; }
      inp.value = val;
      inp.dataset.path = path;
      inp.addEventListener("input", ()=>{
        setPath(DATA, path, inp.value);
        updateStats();
        const tg = fld.querySelector(".tag");
        const ok2 = isReal(inp.value);
        tg.textContent = ok2 ? "已填" : "待补充";
        tg.className = "tag " + (ok2 ? "filled" : "");
        fld.classList.toggle("empty", !ok2);
      });

      const btn = document.createElement("button");
      btn.className = "mini";
      btn.textContent = "复制";
      btn.onclick = ()=>{ copy(inp.value || ""); };

      row.appendChild(inp);
      if (isLong) row.appendChild(btn);
      fld.appendChild(lab); fld.appendChild(row);
      box.appendChild(fld);
    });
    card.appendChild(box);
    app.appendChild(card);
  });
  updateStats();
}

function copy(text){
  if (!text){ toast("内容为空"); return; }
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast("已复制")).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("已复制"); } catch(e){ toast("复制失败，请手动选择"); }
  document.body.removeChild(ta);
}

function updateStats(){
  let empty = 0, total = 0;
  SCHEMA.forEach(sec=>sec.fields.forEach(([k])=>{
    if (!k) return;
    total++;
    const path = sec.prefix ? sec.prefix + "." + k : k;
    if (!isReal(getPath(DATA, path))) empty++;
  }));
  const pct = Math.round((total-empty)/total*100);
  document.getElementById("todoCnt").textContent = empty;
  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("barFill").style.width = pct + "%";
}

/* ============ 按钮 ============ */
document.getElementById("btnSave").onclick = ()=>{
  if (persist()) toast("已保存，去招聘网站点「自动填表」即可");
  else toast("保存失败，请检查扩展权限");
};

document.getElementById("btnExport").onclick = ()=>{
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "简历数据.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出 JSON");
};

document.getElementById("btnImport").onclick = ()=> document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try {
      DATA = deepMerge(DEFAULT_DATA, JSON.parse(r.result));
      persist();
      render(); toast("导入成功");
    } catch(err){ toast("JSON 格式有误：" + err.message); }
  };
  r.readAsText(f, "utf-8");
  e.target.value = "";
};

document.getElementById("btnCopyAll").onclick = ()=>{
  const lines = [];
  SCHEMA.forEach(sec=>{
    const items = [];
    sec.fields.forEach(([k,label])=>{
      if(!k) return;
      const path = sec.prefix ? sec.prefix+"."+k : k;
      const v = String(getPath(DATA, path)||"").trim();
      if (isReal(v)) items.push(`${label}：${v}`);
    });
    if (items.length) lines.push(`【${sec.title}】\n` + items.join("\n"));
  });
  copy(lines.join("\n\n"));
};

loadThen(render);
</script>
</body>
</html>
